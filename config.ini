# ============================================================
#  连接配置（改完保存，不用改 bat）
# ============================================================

# 主机名：同网段优先用这个，主机 IP 变了也能找到
# 改成实际的主机名，例如 MY-LAB-PC
LAN_HOST=YOUR-PC

# 主机在局域网/校园网的 IP：主机名解析失败时用这个
# 改成实际的 IP，例如 192.168.1.100
LAN_IP=192.168.1.100

# 登录用户名（本地账户，格式：计算机名\账户名）
USER=YOUR-PC\Administrator
